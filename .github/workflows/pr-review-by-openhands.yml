name: PR Review by OpenHands

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, labeled, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: openhands-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    if: |
      (github.event.action == 'opened' && github.event.pull_request.draft == false && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR' && github.event.pull_request.author_association != 'NONE') ||
      (github.event.action == 'synchronize' && github.event.pull_request.draft == false && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR' && github.event.pull_request.author_association != 'NONE') ||
      (github.event.action == 'ready_for_review' && github.event.pull_request.author_association != 'FIRST_TIME_CONTRIBUTOR' && github.event.pull_request.author_association != 'NONE') ||
      github.event.label.name == 'review-this' ||
      github.event.requested_reviewer.login == 'openhands-agent' ||
      github.event.requested_reviewer.login == 'all-hands-bot'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review action
        uses: actions/checkout@v4

      - name: Run PR Review
        uses: ./.openhands/plugins/pr-review
        with:
          llm-model: openai/gpt-5.5
          llm-base-url: https://rookiehouse.com/openai/v1
          llm-stream: 'true'
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-sub-agents: 'false'
